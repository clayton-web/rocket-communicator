components:
  schemas:
    NotificationProcessResponse:
      type: object
      description: |
        Aggregate outcome of one internal Owner Event Notification processing invocation (A8.5b,
        A8.5e; D133, D135). Counts only: never an Owner or Recipient address, Task summary, actor
        label, event subject, provider payload, failure detail, capability data, individual expiry
        instant, or claim internal. Nothing here can identify what any notification or capability
        was about.

        Two independently gated phases report separately. The `expiry*` fields describe the capture
        phase and are all zero unless `captureEnabled`; every other count describes the delivery
        phase and is zero unless `deliveryEnabled` and `transportConfigured`. When **both** flags are
        false the invocation returned before opening a database connection, so every count is zero
        and no transport was constructed.
      required:
        - captureEnabled
        - deliveryEnabled
        - transportConfigured
        - expiryScanned
        - expiryObserved
        - expiryLostRaces
        - expiryBatchFilled
        - expiryDeadlineStopped
        - scanned
        - claimed
        - sent
        - failedRetryable
        - failedPermanent
        - ambiguous
        - staleSuppressed
        - retryExhausted
        - recoveredClaims
        - lostClaims
        - batchFilled
        - deadlineStopped
        - requestId
      properties:
        captureEnabled:
          type: boolean
          description: |
            Whether `ENABLE_OWNER_EVENT_CAPTURE` was exactly "true", which is what governs the
            capability-expiry capture phase. False in every environment. Fully independent of
            `deliveryEnabled`: capture records durable events, delivery sends them, and neither
            implies the other (D135).
        deliveryEnabled:
          type: boolean
          description: |
            Whether `ENABLE_OWNER_EVENT_DELIVERY` was exactly "true". False in every environment.
            Independent of `captureEnabled` above.
        transportConfigured:
          type: boolean
          description: |
            Whether a transport was composed for this invocation. False means no delivery was
            attempted: processing refuses to run rather than manufacturing a transport that would
            report deliveries it never made.

            False whenever `deliveryEnabled` is false, since nothing is composed for a phase that is
            not running. Also false when delivery is enabled but the capture phase exhausted the
            invocation's budget first — in that case `expiryDeadlineStopped` is true, and no Gmail
            configuration was read on the way to doing nothing. With delivery enabled and budget
            remaining, false means composition itself failed closed, for example an absent or
            invalid application base URL.
        expiryScanned:
          type: integer
          minimum: 0
          description: |
            Expired capabilities this invocation attempted to transition, oldest expiry first, up to
            the capture phase's own bound. Not a count of every expired capability in existence,
            which would require an unbounded scan.
        expiryObserved:
          type: integer
          minimum: 0
          description: |
            Transitions this invocation won. Each wrote one `capability.expired` audit event and one
            notification intent in the same transaction as the status change.
        expiryLostRaces:
          type: integer
          minimum: 0
          description: |
            Capabilities another observer — a concurrent invocation, or a Recipient presenting the
            lapsed token — had already transitioned. The loser writes nothing at all. Expected under
            overlap, and not an error.
        expiryBatchFilled:
          type: boolean
          description: |
            Whether the expiry scan came back full, so more expired capabilities probably remain for
            the next invocation. Deliberately not a count of what is left.
        expiryDeadlineStopped:
          type: boolean
          description: |
            Whether the capture phase stopped starting transitions to stay inside the invocation's
            runtime budget. When true the delivery phase did not begin at all, and the expiries
            already observed remain committed — their intents are found by the next invocation.
        scanned:
          type: integer
          minimum: 0
          description: |
            Claimable intents examined, including those terminalized without any delivery — a stale
            suppression and an exhausted retry budget are both counted here and also in their own
            field.
        claimed:
          type: integer
          minimum: 0
          description: Intents whose compare-and-set claim succeeded and whose lease this invocation held.
        sent:
          type: integer
          minimum: 0
          description: |
            Deliveries the transport positively accepted. An ambiguous outcome is never counted here
            (D135): the provider may have accepted it, and reporting a delivery that may not have
            happened is the untruth this separation exists to prevent.
        failedRetryable:
          type: integer
          minimum: 0
          description: |
            Retryable transport failures with budget remaining. The intent returned to claimable work
            and will be attempted again on a later invocation, not within this one.
        failedPermanent:
          type: integer
          minimum: 0
          description: Definitive refusals. Terminal on the first occurrence and requiring Owner attention.
        ambiguous:
          type: integer
          minimum: 0
          description: |
            Outcomes the transport could not resolve, including a lease that expired after a provider
            call had begun and a transport that threw once the in-flight marker was durable. Terminal
            on the first occurrence, never retried, and never reported as sent (D135). Requires Owner
            attention.
        staleSuppressed:
          type: integer
          minimum: 0
          description: |
            Intents older than the 24-hour delivery horizon, terminalized without contacting anything
            (D135). This is what stops a backlog accumulated while delivery was disabled from ever
            flushing: those intents expire rather than being drained.
        retryExhausted:
          type: integer
          minimum: 0
          description: |
            Intents that spent their three-attempt budget, terminalized as requiring Owner attention.
            A budget against one event, not a delivery series: D106's fourteen-delivery ceiling and
            D129's ambiguity stop govern Recipient reminders and do not apply here.
        recoveredClaims:
          type: integer
          minimum: 0
          description: |
            Lapsed leases returned to claimable work because no provider call had started. A lapsed
            lease whose provider call had started is counted in `ambiguous` instead and is never
            resent.
        lostClaims:
          type: integer
          minimum: 0
          description: |
            Compare-and-set refusals: another worker moved first, or this one was superseded while
            its call was in flight. Expected under overlapping invocations, and not an error.
        batchFilled:
          type: boolean
          description: |
            Whether the scan returned a full batch, so more work probably remains. Deliberately not a
            count of what is left, which would require an unbounded count over every pending row.
        deadlineStopped:
          type: boolean
          description: |
            Whether the invocation stopped accepting new work to stay inside its runtime budget. Work
            already claimed is settled before stopping, so nothing is abandoned mid-flight by a
            deliberate stop. Invocation-level and therefore true if **either** phase stopped;
            `expiryDeadlineStopped` distinguishes which.
        requestId:
          type: string
          description: Correlates this invocation with its structured logs.
