components:
  schemas:
    CommunicationProvider:
      type: string
      enum:
        - gmail
      description: Connected communication provider. A5 supports Gmail only.
    GmailConnectionStatus:
      type: string
      enum:
        - not_connected
        - pending
        - connected
        - needs_reauth
        - resync_required
        - disconnected
        - error
      description: Owner-visible Gmail connection lifecycle (D065–D076).
    GmailHistoryState:
      type: string
      enum:
        - unset
        - valid
        - resync_required
      description: |
        History cursor validity. Invalid/expired cursors must surface as
        resync_required — never silently reset (D076).
    GmailSyncTrigger:
      type: string
      enum:
        - cron
        - manual
        - initial
      description: What started a sync run.
    GmailSyncOutcome:
      type: string
      enum:
        - running
        - succeeded
        - partial
        - retryable_failure
        - permanent_failure
        - skipped_locked
        - needs_reauth
        - resync_required
      description: Safe sync-run outcome for Owner and operations views.
    GmailConnection:
      type: object
      required:
        - status
        - provider
        - pollingIntervalMinutes
        - inboxOnly
        - readonlyScope
        - historyState
      properties:
        status:
          $ref: '#/components/schemas/GmailConnectionStatus'
        provider:
          $ref: '#/components/schemas/CommunicationProvider'
        emailAddress:
          type: string
          format: email
          maxLength: 320
          description: Connected mailbox address when known. Never a token.
        connectedAt:
          type: string
          format: date-time
        lastSyncAt:
          type: string
          format: date-time
        lastSuccessAt:
          type: string
          format: date-time
        lastErrorCode:
          type: string
          maxLength: 64
          description: Stable machine code only; never raw provider payloads.
        historyState:
          $ref: '#/components/schemas/GmailHistoryState'
        pollingIntervalMinutes:
          type: integer
          minimum: 1
          maximum: 60
          description: Configured poll interval (D065 default 5).
        inboxOnly:
          type: boolean
          description: Always true in A5 (D068).
        readonlyScope:
          type: boolean
          description: |
            True when `gmail.readonly` is granted for ingest/polling (D070).
            Does **not** by itself imply send permission. Prefer `canRead` / `canSend` when present (D093).
        canRead:
          type: boolean
          description: |
            Optional A7+ flag: true when the connection can poll/read Inbox History (`gmail.readonly`).
            When omitted, clients may treat connected + `readonlyScope` as readable for A5 compatibility.
        canSend:
          type: boolean
          description: |
            Optional A7+ flag: true when `gmail.send` is granted for assignment email and forward (D093).
            When omitted or false while connected, A7 handoff requires Owner re-consent (`requiresSendReconsent`).
            Runtime OAuth still requests readonly-only until A7 OAuth work ships — this field is contract-ready.
        requiresSendReconsent:
          type: boolean
          description: |
            Optional A7+ flag: true when handoff/send needs Owner OAuth re-consent to grant `gmail.send`.
            Safe boolean — does not expose raw Google scope strings.
      description: |
        Safe Owner-facing Gmail connection status. Must never include refresh tokens,
        access tokens, ciphertext, encryption key versions, OAuth codes, or PKCE secrets.
        Prefer booleans (`canRead`, `canSend`, `requiresSendReconsent`) over raw provider scope strings (D093, D094).
    GmailDisconnectRequest:
      type: object
      required:
        - confirmation
      properties:
        confirmation:
          type: string
          enum:
            - confirmed
          description: Explicit Owner confirmation to disconnect Gmail.
    GmailDisconnectResponse:
      type: object
      required:
        - connection
      properties:
        connection:
          $ref: '#/components/schemas/GmailConnection'
    GmailSyncRequest:
      type: object
      additionalProperties: false
      properties: {}
      description: Owner-triggered manual sync. Empty body; authentication is the Owner session.
    GmailSyncRun:
      type: object
      required:
        - id
        - trigger
        - outcome
        - startedAt
        - messagesExamined
        - eventsCreated
        - eventsUpdated
        - messagesSkipped
        - retryable
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        trigger:
          $ref: '#/components/schemas/GmailSyncTrigger'
        outcome:
          $ref: '#/components/schemas/GmailSyncOutcome'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        messagesExamined:
          type: integer
          minimum: 0
        eventsCreated:
          type: integer
          minimum: 0
        eventsUpdated:
          type: integer
          minimum: 0
        messagesSkipped:
          type: integer
          minimum: 0
        retryable:
          type: boolean
        errorCode:
          type: string
          maxLength: 64
          description: Stable machine code only; never raw exception text or tokens.
        requestId:
          type: string
          maxLength: 64
      description: |
        Safe sync-run summary. Must never include historyId secrets that are not already
        Owner-visible operational state, tokens, or raw provider error bodies.
    GmailSyncResponse:
      type: object
      required:
        - run
        - connection
      properties:
        run:
          $ref: '#/components/schemas/GmailSyncRun'
        connection:
          $ref: '#/components/schemas/GmailConnection'
    GmailPollResponse:
      type: object
      required:
        - runsProcessed
        - skippedLocked
        - requestId
      properties:
        runsProcessed:
          type: integer
          minimum: 0
        skippedLocked:
          type: integer
          minimum: 0
        requestId:
          type: string
          maxLength: 64
      description: Aggregate poll outcome. No tokens or per-message bodies.
    GmailIntakeItem:
      type: object
      additionalProperties: false
      required:
        - id
        - fromAddress
        - receivedAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Organization-scoped CommunicationEvent id. Stable identity for a later Owner
            Review-with-Rocket request. Not a Gmail API message id.
        fromAddress:
          type: string
          maxLength: 320
          description: Sender address already stored on the A5 CommunicationEvent.
        subject:
          type:
            - string
            - 'null'
          maxLength: 256
        snippet:
          type:
            - string
            - 'null'
          maxLength: 512
          description: |
            Capped A5 preview already stored on the event. Not the TemporaryCommunicationExcerpt
            body and not a raw Gmail payload.
        receivedAt:
          type: string
          format: date-time
      description: |
        One currently reviewable Gmail occurrence for the Owner Gmail intake surface (D179 / S7).
        Narrow on purpose: enough to select a message and later Review with Rocket, not a
        communication-event browser. Omits labels, recipients, attachments, A6 processing state,
        excerpt bodies, provider tokens, and organization/account ids.
    CreateGmailReviewRequest:
      type: object
      additionalProperties: false
      required:
        - communicationEventId
      properties:
        communicationEventId:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The CommunicationEvent id returned by the Gmail intake list. The server resolves the
            Gmail occurrence and its temporary excerpt; clients do not send source kind,
            organization, raw text, or capturedAt. Current Inbox eligibility is required to start
            a new interpretation, not to replay an already-persisted exact result.
      description: |
        Owner request to Review one eligible Gmail occurrence with Rocket (D179). Provenance is
        fixed server-side as `gmail`. The organization comes from the authenticated Owner session.
    GmailReviewResponse:
      type: object
      additionalProperties: false
      required:
        - idempotentReplay
        - interpretedAt
        - taskSuggestions
      properties:
        idempotentReplay:
          type: boolean
          description: |
            `true` when this response replays a prior committed interpretation for the same
            organization, Idempotency-Key, and request payload. A replay is answered from canonical
            state and does not call the interpretation provider again.
        interpretedAt:
          type: string
          format: date-time
          description: |
            When the interpretation that produced these proposals committed. On a replay this is the
            original occurrence's time, not the time of the replayed request.
        taskSuggestions:
          type: array
          maxItems: 10
          items:
            $ref: './task-suggestion.yaml#/components/schemas/TaskSuggestion'
          description: |
            The 0..N canonical pending proposals this Gmail Review produced, using the same
            `TaskSuggestion` schema the Owner proposal reads return. An empty array is truthful
            success, not a failure.
      description: |
        Result of an Owner Gmail Review with Rocket (D179).

        Same public interpretation result shape as manual capture: replay flag, commit time, and
        canonical proposals. Interpretation provenance is persistence-only and is not published:
        no `interpretationRunId`, no request fingerprint, no persisted idempotency key, no
        `modelVersion` or `policyVersion`, and no excerpt echo.

        Creates no canonical Task, no approval, no responsibility selection, and no TaskAssignment.
        Acceptance remains the Owner's through the existing S5 proposal review path.
    CreateGmailSenderExclusionRequest:
      type: object
      additionalProperties: false
      required:
        - communicationEventId
      properties:
        communicationEventId:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            CommunicationEvent id of a Gmail occurrence whose normalized sender should be excluded.
            The server resolves the stored From address; clients do not send the email address,
            organization, or source kind.
      description: |
        Owner request to exclude a Gmail sender from S7 Review with Rocket (D180). The exclusion
        key is the existing Gmail-ingestion normalized sender address for this occurrence.
    GmailSenderExclusion:
      type: object
      additionalProperties: false
      required:
        - id
        - createdAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Organization-scoped exclusion id used to remove the exclusion.
        createdAt:
          type: string
          format: date-time
      description: |
        Public Gmail sender-exclusion handle (D180). Deliberately omits the excluded address: the
        canonical preference row remains the durable store, and this response is only enough to
        undo. Contains no message body or excerpt.
