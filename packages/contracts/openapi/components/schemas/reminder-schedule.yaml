components:
  schemas:
    TaskReminderScheduleState:
      type: string
      description: |
        Truthful reminder state for a Task (D104, D107). Distinguishes "the Owner never chose a due
        date" from "a due date exists but nothing is scheduled", because those need different Owner
        actions and a single boolean would hide that.
      enum:
        - no_due_date
        - not_scheduled
        - active
        - suspended_waiting
        - stopped

    TaskReminderStopReason:
      type: string
      description: |
        Why reminders stopped. Recorded when the schedule stops, never inferred later (D106, D107).

        `repeated_ambiguous_outcomes` is D129: three consecutive terminal ambiguous overdue
        occurrences within one schedule generation. An ambiguous occurrence is one where the
        transport could not prove whether the provider accepted the message, so it consumed its
        local calendar day and was never retried. It is kept distinct from
        `permanent_delivery_failure` because the Owner's question differs: a permanent failure says
        the provider refused something and names what to fix, while this says the provider gave no
        answer three mornings running and the Recipient may or may not have been reminded.

        Reminders never resume by themselves after any stop. Only a material Owner due-date change
        opens a new generation, and the new generation begins with no ambiguity history of its own.
      enum:
        - task_completed
        - task_dismissed
        - due_date_removed
        - overdue_ceiling_reached
        - permanent_delivery_failure
        - repeated_ambiguous_outcomes

    TaskReminderAdvanceDisposition:
      type: string
      description: |
        What happened to this generation's advance reminder (D105, D107). `scheduled` is the only
        value that means anything is still pending; every other value is terminal and settled.

        The occurrence's own date is reported for every disposition, so a client can always say which
        morning was involved.

        Decided at establishment:

        - `scheduled` — the advance reminder is owed and has not yet been processed.
        - `skipped_window_elapsed` — the day before the due date had already passed when the Owner
          chose the date, so no advance reminder was ever scheduled.

        Decided by a Task lifecycle transition:

        - `skipped_waiting_elapsed` — the advance reminder was validly scheduled and the Task was
          Waiting when it came due. Permanently skipped for this generation, never replayed on resume.

        Decided by occurrence processing (A8.4a, A8.4b.3). Processing is disabled by default and
        reaches no real provider unless `ENABLE_REMINDER_DELIVERY` is set, which it is in no
        environment, so these values cannot occur in the deployed application in this milestone:

        - `delivered` — the occurrence reached a provider that accepted it.
        - `skipped_window_elapsed` — also written here when the worker reached a validly scheduled
          advance occurrence after its local calendar day had ended (A8.4b.3). The same fact as the
          establishment-time value: the morning went by unsent. Distinct from `skipped_not_eligible`
          because nothing was wrong with the Task, and the remedy differs.
        - `skipped_not_eligible` — a pre-send check found the Task or schedule no longer eligible.
        - `failed_permanent` — delivery failed in a way that retrying cannot fix, or the retry budget
          was exhausted.
        - `ambiguous` — the transport could not report whether the message was accepted. Treated as
          sent and never retried, because a Recipient hearing about the same morning twice is the
          worse failure.
      enum:
        - scheduled
        - skipped_window_elapsed
        - skipped_waiting_elapsed
        - delivered
        - skipped_not_eligible
        - failed_permanent
        - ambiguous

    TaskReminderOccurrence:
      type: object
      description: |
        One reminder occurrence. `localDate` is the organization-local calendar day and is
        authoritative; `at` is the absolute instant that day's 09:00 organization-local resolves to,
        supplied for display and ordering only (D103).
      required:
        - localDate
        - at
      additionalProperties: false
      properties:
        localDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Canonical organization-local calendar date.
        at:
          type: string
          format: date-time

    TaskReminderAdvance:
      type: object
      description: The single advance reminder for the current generation (D105).
      required:
        - disposition
      additionalProperties: false
      properties:
        disposition:
          $ref: '#/components/schemas/TaskReminderAdvanceDisposition'
        occurrence:
          description: |
            The advance occurrence. Present for both dispositions: a skipped advance still has the
            morning it would have used, and the Owner surface must be able to say which one.
          oneOf:
            - $ref: '#/components/schemas/TaskReminderOccurrence'
            - type: 'null'

    TaskReminderState:
      type: object
      description: |
        Owner-facing reminder state for one Task (D104, D106, D107). Read-only projection of the
        Task Reminder Schedule. Deliberately excludes worker internals — claim leases, worker
        identifiers, delivery-attempt rows, provider message identifiers, and raw failure detail are
        not part of this contract.
      required:
        - taskId
        - etag
        - state
        - requiresOwnerAttention
      additionalProperties: false
      properties:
        taskId:
          type: string
          maxLength: 64
        etag:
          type: string
          description: |
            Strong ETag for the *reminder* resource, required as `If-Match` on PUT and DELETE.
            Distinct from the Task ETag: a reminder change deliberately does not bump `Task.version`,
            so a Task ETag cannot detect that reminder state moved. Opaque — clients must echo it, not
            parse it. Also returned in the `ETag` response header.
        dueLocalDate:
          description: |
            The canonical Owner-selected organization-local due date. Null when the Owner has not
            chosen one. This is authoritative for reminders; the instant-typed `Task.dueAt` is not
            (D102, D109).
          oneOf:
            - type: string
              pattern: '^\d{4}-\d{2}-\d{2}$'
            - type: 'null'
        schedulingTimeZone:
          description: |
            The IANA timezone the current generation's occurrences were resolved in, snapshotted at
            establishment. Server-derived; the Owner does not choose it (D034, D103).
          oneOf:
            - type: string
            - type: 'null'
        state:
          description: |
            Authoritative for whether reminders will be sent. `advance` and `nextOverdueOccurrence`
            describe the current generation's recorded decisions; when `state` is `stopped` those
            are history and nothing further will be delivered.
          $ref: '#/components/schemas/TaskReminderScheduleState'
        generation:
          description: |
            Which schedule generation is current. Increments when the Owner materially changes the
            due date; an unchanged re-save does not increment it (D104).
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        advance:
          oneOf:
            - $ref: '#/components/schemas/TaskReminderAdvance'
            - type: 'null'
        nextOverdueOccurrence:
          description: The next overdue reminder occurrence owed, or null when none is (D106).
          oneOf:
            - $ref: '#/components/schemas/TaskReminderOccurrence'
            - type: 'null'
        overdueDeliveredCount:
          description: |
            Successful overdue deliveries in the current generation, counted toward the D106 ceiling.
            Zero until a delivery path exists.
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        requiresOwnerAttention:
          type: boolean
          description: Whether the schedule needs an Owner decision, for example after the overdue ceiling (D106, D108).
        stopReason:
          oneOf:
            - $ref: '#/components/schemas/TaskReminderStopReason'
            - type: 'null'

    SetTaskReminderRequest:
      type: object
      description: |
        The only Owner-selectable reminder input is the due date. There is no reminder-time field —
        occurrences are fixed at 09:00 organization-local (D103) — no preset interval (D102), no
        recurrence, and no timezone field. Occurrence dates, instants, generation, status, counts,
        and stop reasons are all server-derived and must never be accepted from a client.
      required:
        - dueLocalDate
      additionalProperties: false
      properties:
        dueLocalDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Owner-selected organization-local calendar date. No time component (D103).

    ReminderProcessResponse:
      type: object
      description: |
        Aggregate outcome of one internal reminder-processing invocation (A8.4a, A8.4b.1). Counts
        only: never a Task summary, Recipient identity, address, provider payload, failure detail, or
        claim internal. When `deliveryEnabled`, `transportConfigured`, or `transportAuthorized` is
        false every count is zero, because the invocation scanned nothing, claimed nothing, wrote
        nothing, and called no transport.
      required:
        - deliveryEnabled
        - transportConfigured
        - transportAuthorized
        - schedulesScanned
        - occurrencesClaimed
        - claimRefusals
        - delivered
        - skipped
        - failedRetryable
        - failedPermanent
        - ambiguous
        - recoveredClaims
        - retryBudgetTerminalizations
        - unsettledOccurrencesSettled
        - settlementsDeferred
        - ceilingStops
        - ambiguityStops
        - deadlineStopped
        - requestId
      properties:
        deliveryEnabled:
          type: boolean
          description: |
            Whether `ENABLE_REMINDER_DELIVERY` was exactly "true". False in every environment in
            this milestone.
        transportConfigured:
          type: boolean
          description: |
            Whether a transport was available to send through. False means the invocation failed
            closed and did no work at all: processing refuses to run rather than manufacturing a
            transport that would report deliveries it never made. Also false whenever delivery is
            disabled, because no transport is constructed at all in that case.
        transportAuthorized:
          type: boolean
          description: |
            Whether this invocation held a usable provider authorization when it began scanning.

            Only meaningful when `deliveryEnabled` and `transportConfigured` are both true. It is
            false by default in the other two cases, where authorization was never attempted at all,
            so the three flags must be read as a triple: (false, false, false) is delivery disabled,
            (true, false, false) is delivery enabled with nothing to send through, (true, true,
            false) is authorization unusable, and (true, true, true) is an invocation that scanned.

            False with the first two true means the Owner's Gmail connection is missing, has not
            granted the send scope, or could not produce an access token, and the invocation stopped
            before its first claim: no occurrence was created, no schedule moved, and no provider was
            contacted. Authorization is resolved once per invocation and always before any claim, so
            an unusable connection is never charged to a Task as a delivery failure. Which of those
            causes applied is deliberately not reported here.
        schedulesScanned:
          type: integer
          minimum: 0
          description: |
            Due occurrences the two scans returned, not distinct schedules (A8.4b.3). A schedule that
            owes both its advance morning and an overdue morning in the same invocation — which needs
            an outage long enough for the due date itself to pass — is counted once per occurrence,
            because each is claimed, guarded, and settled separately.
        occurrencesClaimed:
          type: integer
          minimum: 0
        claimRefusals:
          type: integer
          minimum: 0
          description: |
            Occurrences a claim was refused for — held by another worker, already terminal, or out
            of retry budget. Ordinary contention; a persistently non-zero value alongside zero
            claims is the signature of a stuck occurrence.
        delivered:
          type: integer
          minimum: 0
          description: |
            Occurrences a transport confirmed it accepted. Never an ambiguous outcome: a send whose
            result could not be determined is counted under `ambiguous` and is never reported here.
        skipped:
          type: integer
          minimum: 0
          description: Occurrences a pre-send eligibility check truthfully refused.
        failedRetryable:
          type: integer
          minimum: 0
          description: Definite rejections that leave the occurrence owed and retryable.
        failedPermanent:
          type: integer
          minimum: 0
        ambiguous:
          type: integer
          minimum: 0
          description: |
            Occurrences whose result could not be determined. Terminal and never retried.
        recoveredClaims:
          type: integer
          minimum: 0
          description: Abandoned occurrence claims released or finalized before this batch ran.
        retryBudgetTerminalizations:
          type: integer
          minimum: 0
          description: |
            Occurrences that had spent their retry budget without reaching a terminal outcome and
            were terminalized as permanent failures. Non-zero means a worker died mid-attempt at
            some point; a schedule left in that state would otherwise be re-scanned indefinitely.
        unsettledOccurrencesSettled:
          type: integer
          minimum: 0
          description: |
            Terminal occurrences whose schedule settlement had not completed, and was completed by
            this invocation. Non-zero means a previous invocation died between recording an outcome
            and applying it to the schedule.
        settlementsDeferred:
          type: integer
          minimum: 0
          description: |
            Schedule settlements this invocation could not complete. The occurrence outcomes are
            recorded and durable regardless; the debt is picked up by a later invocation.
        ceilingStops:
          type: integer
          minimum: 0
          description: Schedules stopped by reaching the D106 overdue delivery ceiling.
        ambiguityStops:
          type: integer
          minimum: 0
          description: |
            Schedules stopped by D129 — a third consecutive terminal ambiguous overdue occurrence in
            one generation.

            Reported separately from `ceilingStops` because the two mean opposite things. A ceiling
            stop is a schedule that finished its work; an ambiguity stop is the system reporting that
            it cannot tell whether the last three reminders reached anyone. Non-zero here is the
            signal to inspect the provider path, not the affected Tasks.
        deadlineStopped:
          type: boolean
          description: |
            Whether the invocation stopped at its soft deadline with work still outstanding. The
            remaining work is durable and picked up by the next invocation.
        requestId:
          type: string
          maxLength: 64
